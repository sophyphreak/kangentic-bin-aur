name: Update AUR Package

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git openssh curl jq
          useradd -m builder

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH for AUR
        run: |
          install -d -m 700 /home/builder/.ssh
          printf '%s\n' "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          printf '%s\n' 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > /home/builder/.ssh/known_hosts
          cat > /home/builder/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            StrictHostKeyChecking yes
          EOF
          chown -R builder:builder /home/builder/.ssh

      - name: Test AUR SSH access
        run: |
          su builder -c "ssh -o BatchMode=yes aur@aur.archlinux.org help >/dev/null"

      - name: Update package and publish to AUR
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && ./scripts/update-and-publish.sh"

      - name: Write sync summary
        if: success()
        run: |
          . "$GITHUB_WORKSPACE/sync-result.env"

          {
            echo "## Kangentic AUR sync"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | ${status} |"
            echo "| Updated package files | ${updated} |"
            echo "| Previous package version | ${current_version} |"
            echo "| Latest upstream release | ${latest_version} |"
            echo "| Started | ${run_started_utc} |"
            echo "| Completed | ${run_completed_utc} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$updated" == "true" ]]; then
            {
              echo "| Release asset | ${asset} |"
              echo "| SHA-256 | \`${sha256}\` |"
              echo "| GitHub maintenance commit | \`${github_commit}\` |"
              echo "| AUR package commit | \`${aur_commit}\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "No update was needed; the AUR package already matched the latest upstream release." >> "$GITHUB_STEP_SUMMARY"
          fi
